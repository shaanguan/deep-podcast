# ============================================================
# Deep Podcast 配置文件 (科技播客优化版)
# ============================================================

# 全局演技配置
style:
  temperature: 0.1        # 极低随机性，追求极致稳定
  top_P: 0.6              # 降低采样范围，确保术语准确
  top_K: 20
  
  # 文本精修参数 (ChatTTS RefineText)
  refine:
    oral: 0               # 口语化归零，追求干练
    laugh: 0              # 严肃讨论
    break: 3              # 句子内部流畅

# 固定角色配置
roles:
  "1":
    seed: 3333            # 固定女声种子
    prompt: "[speed_5]"
    desc: "主持人(知性女声)"
    refine_override:
      oral: 0
      laugh: 0
      break: 3
  
  "2":
    seed: 6666            # 深沉男声
    prompt: "[speed_6]"   # 语速稍快，体现专业感
    desc: "嘉宾(技术专家)"
    refine_override:
      oral: 1             # 稍微自然一点
      laugh: 0
      break: 4            # 思考感停顿

# 自动种子生成策略
auto_seed:
  base: 5000
  step: 337

# 音频配置
audio:
  sample_rate: 24000      # 采样率
  pause_duration: 0.75    # 稍长的停顿，留白
  normalize: true         # 是否归一化响度
  use_room_tone: false    # 关闭底噪，使用纯静音
  room_tone_volume: 0.01  # 底噪音量
  crossfade_ms: 80        # 顺滑拼接

# 文本处理配置
text:
  max_chunk_length: 100   # 长文本切分阈值
  convert_numbers: true   # 数字转汉字
