# ============================================================
# Deep Podcast 配置文件
# ============================================================

# 全局演技配置
style:
  temperature: 0.3        # 随机性 (0.1稳定 - 0.9疯狂)
  top_P: 0.7
  top_K: 20
  
  # 文本精修参数 (ChatTTS RefineText)
  refine:
    oral: 2               # 口语化程度 (0-9)
    laugh: 0              # 笑声概率 (0-9)
    break: 4              # 停顿概率 (0-9)

# 固定角色配置
# 未在此定义的角色将自动分配声纹
roles:
  "1":
    seed: 3333            # 固定女声种子
    prompt: "[speed_5]"
    desc: "主持人(知性女声)"
    # 主持人需要更专业清晰
    refine_override:
      oral: 0
      laugh: 0
      break: 3
  
  # 示例：如需固定其他角色，取消注释并修改
  # "2":
  #   seed: 2222
  #   prompt: "[speed_5]"
  #   desc: "嘉宾(男声)"
  #   refine_override:
  #     oral: 3
  #     laugh: 1

# 自动种子生成策略
# 新角色的 Seed = base + (ID * step)
auto_seed:
  base: 5000
  step: 337

# 音频配置
audio:
  sample_rate: 24000      # 采样率
  pause_duration: 0.5     # 段落间停顿(秒)
  normalize: true         # 是否归一化响度
  use_room_tone: true     # 使用底噪代替静音
  room_tone_volume: 0.01  # 底噪音量 (0.0-1.0)
  crossfade_ms: 50        # 交叉淡入淡出(毫秒)

# 文本处理配置
text:
  max_chunk_length: 100   # 长文本切分阈值(字符)
  convert_numbers: true   # 数字转汉字

