<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Podcast - AI 播客生成器</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* Colors */
            --bg-0: #09090b;
            --bg-1: #0c0c0f;
            --bg-2: #131316;
            --bg-3: #1a1a1f;
            --bg-4: #222228;
            --bg-hover: #2a2a32;
            
            --border-1: #1f1f24;
            --border-2: #2a2a32;
            --border-3: #3a3a44;
            
            --text-1: #fafafa;
            --text-2: #a1a1aa;
            --text-3: #71717a;
            --text-4: #52525b;
            
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --accent-muted: rgba(139, 92, 246, 0.15);
            
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            
            /* Typography */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
            
            /* Spacing */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
        }
        
        html {
            font-size: 14px;
        }
        
        body {
            font-family: var(--font-sans);
            background: var(--bg-0);
            color: var(--text-1);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* ===== Layout ===== */
        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* ===== Header ===== */
        .header {
            height: 56px;
            background: var(--bg-1);
            border-bottom: 1px solid var(--border-1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #c084fc);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .logo-icon svg {
            width: 18px;
            height: 18px;
        }
        
        .logo-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-1);
        }
        
        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-2);
            border: 1px solid var(--border-1);
            border-radius: var(--radius-md);
            font-size: 12px;
            color: var(--text-2);
        }
        
        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-4);
        }
        
        .status-indicator.ready { background: var(--success); }
        .status-indicator.loading { background: var(--warning); animation: pulse 1.5s ease-in-out infinite; }
        .status-indicator.error { background: var(--error); }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* ===== Main Content ===== */
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 360px;
            background: var(--bg-0);
        }
        
        /* ===== Panel ===== */
        .panel {
            padding: 24px;
            overflow-y: auto;
        }
        
        .panel-left {
            background: var(--bg-0);
            border-right: 1px solid var(--border-1);
        }
        
        .panel-right {
            background: var(--bg-1);
        }
        
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .panel-title svg {
            width: 14px;
            height: 14px;
            color: var(--text-4);
        }
        
        /* ===== Upload Zone ===== */
        .upload-zone {
            border: 1px dashed var(--border-2);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
            background: var(--bg-1);
        }
        
        .upload-zone:hover {
            border-color: var(--accent);
            background: var(--accent-muted);
        }
        
        .upload-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-muted);
        }
        
        .upload-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 12px;
            color: var(--text-4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .upload-icon svg {
            width: 24px;
            height: 24px;
        }
        
        .upload-text {
            font-size: 13px;
            color: var(--text-2);
            margin-bottom: 4px;
        }
        
        .upload-hint {
            font-size: 11px;
            color: var(--text-4);
        }
        
        /* ===== Editor ===== */
        .editor-wrapper {
            position: relative;
        }
        
        .editor {
            width: 100%;
            min-height: 380px;
            background: var(--bg-2);
            border: 1px solid var(--border-1);
            border-radius: var(--radius-lg);
            padding: 16px;
            color: var(--text-1);
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.7;
            resize: none;
            outline: none;
            transition: border-color 0.2s ease;
        }
        
        .editor:focus {
            border-color: var(--accent);
        }
        
        .editor::placeholder {
            color: var(--text-4);
        }
        
        /* ===== Stats Bar ===== */
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 14px 0;
            margin-top: 16px;
            border-top: 1px solid var(--border-1);
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-4);
        }
        
        .stat-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            font-family: var(--font-mono);
        }
        
        /* ===== Role Card ===== */
        .role-card {
            background: var(--bg-2);
            border: 1px solid var(--border-1);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            transition: border-color 0.2s ease;
        }
        
        .role-card:hover {
            border-color: var(--border-2);
        }
        
        .role-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .role-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .role-avatar svg {
            width: 20px;
            height: 20px;
        }
        
        .role-avatar.host {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
        }
        
        .role-avatar.guest {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
        }
        
        .role-info h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-1);
            margin-bottom: 2px;
        }
        
        .role-info p {
            font-size: 11px;
            color: var(--text-4);
        }
        
        /* ===== Controls ===== */
        .control {
            margin-bottom: 14px;
        }
        
        .control:last-child {
            margin-bottom: 0;
        }
        
        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .control-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .control-value {
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-mono);
            color: var(--text-2);
            background: var(--bg-3);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
        }
        
        .control-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        /* ===== Slider ===== */
        input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--bg-4);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 0 4px var(--accent-muted);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        
        /* ===== Divider ===== */
        .divider {
            height: 1px;
            background: var(--border-1);
            margin: 20px 0;
        }
        
        /* ===== Buttons ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            outline: none;
        }
        
        .btn svg {
            width: 14px;
            height: 14px;
        }
        
        .btn-ghost {
            background: transparent;
            color: var(--text-2);
            border: 1px solid var(--border-2);
        }
        
        .btn-ghost:hover {
            background: var(--bg-3);
            color: var(--text-1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #a855f7);
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: var(--radius-lg);
            width: 100%;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.25);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.35);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* ===== Progress ===== */
        .progress-section {
            margin-top: 16px;
            display: none;
        }
        
        .progress-section.active {
            display: block;
        }
        
        .progress-bar {
            height: 3px;
            background: var(--bg-4);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a855f7);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 11px;
            color: var(--text-3);
            text-align: center;
            margin-top: 8px;
        }
        
        /* ===== Audio Player ===== */
        .audio-section {
            margin-top: 16px;
            display: none;
        }
        
        .audio-section.active {
            display: block;
        }
        
        .audio-card {
            background: var(--bg-2);
            border: 1px solid var(--border-1);
            border-radius: var(--radius-lg);
            padding: 16px;
        }
        
        .audio-card audio {
            width: 100%;
            height: 36px;
            border-radius: var(--radius-md);
        }
        
        .audio-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }
        
        .audio-duration {
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--text-3);
        }
        
        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-2);
            background: var(--bg-3);
            border: 1px solid var(--border-2);
            border-radius: var(--radius-md);
            text-decoration: none;
            transition: all 0.15s ease;
        }
        
        .btn-download:hover {
            background: var(--bg-4);
            color: var(--text-1);
        }
        
        .btn-download svg {
            width: 12px;
            height: 12px;
        }
        
        /* ===== Hidden ===== */
        #file-input {
            display: none;
        }
        
        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }
            
            .panel-left {
                border-right: none;
                border-bottom: 1px solid var(--border-1);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i data-lucide="mic"></i>
                </div>
                <span class="logo-text">Deep Podcast</span>
            </div>
            <div class="header-status">
                <span class="status-indicator" id="status-dot"></span>
                <span id="status-text">未加载</span>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="main">
            <!-- Left Panel: Editor -->
            <div class="panel panel-left">
                <div class="panel-header">
                    <span class="panel-title">
                        <i data-lucide="file-text"></i>
                        脚本编辑器
                    </span>
                    <button class="btn btn-ghost" id="load-sample">
                        <i data-lucide="file-plus"></i>
                        加载示例
                    </button>
                </div>
                
                <div class="upload-zone" id="upload-zone">
                    <div class="upload-icon">
                        <i data-lucide="upload-cloud"></i>
                    </div>
                    <div class="upload-text">拖放文件到此处，或点击上传</div>
                    <div class="upload-hint">支持 TXT、DOCX、JSON、MD 格式</div>
                </div>
                <input type="file" id="file-input" accept=".txt,.docx,.json,.md">
                
                <div class="editor-wrapper">
                    <textarea class="editor" id="script-input" placeholder="发言人1 大家好，欢迎收听本期节目！

发言人2 今天我们来聊一个很有意思的话题...

发言人1 那我们开始吧"></textarea>
                </div>
                
                <div class="stats-bar">
                    <div class="stat">
                        <span class="stat-label">对话</span>
                        <span class="stat-value" id="stat-dialogues">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">角色</span>
                        <span class="stat-value" id="stat-speakers">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">字数</span>
                        <span class="stat-value" id="stat-chars">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">预估</span>
                        <span class="stat-value" id="stat-duration">0:00</span>
                    </div>
                </div>
            </div>
            
            <!-- Right Panel: Settings -->
            <div class="panel panel-right">
                <div class="panel-header">
                    <span class="panel-title">
                        <i data-lucide="settings-2"></i>
                        角色配置
                    </span>
                </div>
                
                <!-- Host -->
                <div class="role-card">
                    <div class="role-header">
                        <div class="role-avatar host">
                            <i data-lucide="user"></i>
                        </div>
                        <div class="role-info">
                            <h3>主持人</h3>
                            <p>发言人 1</p>
                        </div>
                    </div>
                    
                    <div class="control">
                        <div class="control-header">
                            <span class="control-label">声纹种子</span>
                            <span class="control-value" id="host-seed-value">3333</span>
                        </div>
                        <input type="range" id="host-seed" min="1" max="9999" value="3333">
                    </div>
                    
                    <div class="control-row">
                        <div class="control">
                            <div class="control-header">
                                <span class="control-label">语速</span>
                                <span class="control-value" id="host-speed-value">5</span>
                            </div>
                            <input type="range" id="host-speed" min="1" max="9" value="5">
                        </div>
                        <div class="control">
                            <div class="control-header">
                                <span class="control-label">情感</span>
                                <span class="control-value" id="host-emotion-value">3</span>
                            </div>
                            <input type="range" id="host-emotion" min="0" max="9" value="3">
                        </div>
                    </div>
                </div>
                
                <!-- Guest -->
                <div class="role-card">
                    <div class="role-header">
                        <div class="role-avatar guest">
                            <i data-lucide="user"></i>
                        </div>
                        <div class="role-info">
                            <h3>嘉宾</h3>
                            <p>发言人 2</p>
                        </div>
                    </div>
                    
                    <div class="control">
                        <div class="control-header">
                            <span class="control-label">声纹种子</span>
                            <span class="control-value" id="guest-seed-value">5674</span>
                        </div>
                        <input type="range" id="guest-seed" min="1" max="9999" value="5674">
                    </div>
                    
                    <div class="control-row">
                        <div class="control">
                            <div class="control-header">
                                <span class="control-label">语速</span>
                                <span class="control-value" id="guest-speed-value">5</span>
                            </div>
                            <input type="range" id="guest-speed" min="1" max="9" value="5">
                        </div>
                        <div class="control">
                            <div class="control-header">
                                <span class="control-label">情感</span>
                                <span class="control-value" id="guest-emotion-value">5</span>
                            </div>
                            <input type="range" id="guest-emotion" min="0" max="9" value="5">
                        </div>
                    </div>
                </div>
                
                <div class="divider"></div>
                
                <!-- Generate -->
                <button class="btn btn-primary" id="generate-btn">
                    <i data-lucide="sparkles"></i>
                    开始生成
                </button>
                
                <div class="progress-section" id="progress-section">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text" id="progress-text">准备中...</div>
                </div>
                
                <div class="audio-section" id="audio-section">
                    <div class="audio-card">
                        <audio controls id="audio-player">
                            <source src="" type="audio/wav">
                        </audio>
                        <div class="audio-actions">
                            <span class="audio-duration" id="audio-duration">--:--</span>
                            <a href="/api/audio" download="podcast.wav" class="btn-download">
                                <i data-lucide="download"></i>
                                下载音频
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Elements
        const scriptInput = document.getElementById('script-input');
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const generateBtn = document.getElementById('generate-btn');
        const progressSection = document.getElementById('progress-section');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const audioSection = document.getElementById('audio-section');
        const audioPlayer = document.getElementById('audio-player');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        
        // Slider bindings
        const sliders = ['host-seed', 'host-speed', 'host-emotion', 'guest-seed', 'guest-speed', 'guest-emotion'];
        sliders.forEach(id => {
            const slider = document.getElementById(id);
            const display = document.getElementById(id + '-value');
            slider.addEventListener('input', () => {
                display.textContent = slider.value;
            });
        });
        
        // Parse script
        let parseTimeout;
        scriptInput.addEventListener('input', () => {
            clearTimeout(parseTimeout);
            parseTimeout = setTimeout(parseScript, 500);
        });
        
        async function parseScript() {
            const text = scriptInput.value;
            if (!text.trim()) {
                updateStats({ dialogues: 0, speakers: 0, chars: 0, duration: 0 });
                return;
            }
            
            try {
                const res = await fetch('/api/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.success) {
                    updateStats(data.stats);
                }
            } catch (e) {
                console.error(e);
            }
        }
        
        function updateStats(stats) {
            document.getElementById('stat-dialogues').textContent = stats.dialogues;
            document.getElementById('stat-speakers').textContent = stats.speakers;
            document.getElementById('stat-chars').textContent = stats.chars;
            const min = Math.floor(stats.duration / 60);
            const sec = stats.duration % 60;
            document.getElementById('stat-duration').textContent = `${min}:${sec.toString().padStart(2, '0')}`;
        }
        
        // File upload
        uploadZone.addEventListener('click', () => fileInput.click());
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) uploadFile(file);
        });
        
        fileInput.addEventListener('change', () => {
            if (fileInput.files[0]) uploadFile(fileInput.files[0]);
        });
        
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    scriptInput.value = data.text;
                    parseScript();
                } else {
                    alert(data.error);
                }
            } catch (e) {
                alert('上传失败');
            }
        }
        
        // Load sample
        document.getElementById('load-sample').addEventListener('click', () => {
            scriptInput.value = `发言人1 大家好，欢迎收听本期播客！今天我们要聊一个非常有意思的话题——人工智能正在如何改变我们的生活。

发言人2 没错，这个话题最近真的太火了。你看现在到处都在讨论AI，从ChatGPT到各种AI绘画工具，感觉一夜之间AI就无处不在了。

发言人1 确实如此。我记得几年前，AI还只是科幻电影里的概念，现在却已经渗透到了我们日常生活的方方面面。

发言人2 对对对，我最近就在用AI帮我写代码、整理文档，效率提升了不少。你有没有类似的体验？

发言人1 当然有！我现在写文章都会先让AI帮我列个大纲，然后再自己填充内容。不过说实话，我觉得AI目前还是个很好的助手，但完全取代人类的创造力，我觉得还早。

发言人2 这点我同意。AI擅长的是处理大量信息、找规律，但真正的创新和情感共鸣，还是需要人来把握。

发言人1 好的，那我们今天就先聊到这里。感谢大家的收听，我们下期再见！`;
            parseScript();
        });
        
        // Generate
        generateBtn.addEventListener('click', async () => {
            const text = scriptInput.value;
            if (!text.trim()) {
                alert('请先输入脚本内容');
                return;
            }
            
            generateBtn.disabled = true;
            progressSection.classList.add('active');
            audioSection.classList.remove('active');
            progressFill.style.width = '0%';
            progressText.textContent = '准备中...';
            
            const settings = {
                host_seed: parseInt(document.getElementById('host-seed').value),
                host_speed: parseInt(document.getElementById('host-speed').value),
                host_emotion: parseInt(document.getElementById('host-emotion').value),
                guest_seed: parseInt(document.getElementById('guest-seed').value),
                guest_speed: parseInt(document.getElementById('guest-speed').value),
                guest_emotion: parseInt(document.getElementById('guest-emotion').value),
            };
            
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, settings })
                });
                
                const data = await res.json();
                if (!data.success) {
                    alert(data.error);
                    generateBtn.disabled = false;
                    progressSection.classList.remove('active');
                    return;
                }
                
                pollProgress();
                
            } catch (e) {
                alert('请求失败');
                generateBtn.disabled = false;
                progressSection.classList.remove('active');
            }
        });
        
        async function pollProgress() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                updateStatus(data.status, data.model_loaded);
                
                progressFill.style.width = (data.progress * 100) + '%';
                
                if (data.status === 'loading') {
                    progressText.textContent = '加载模型中...';
                } else if (data.status === 'generating') {
                    progressText.textContent = `生成中 ${Math.round(data.progress * 100)}%`;
                } else if (data.status === 'complete') {
                    progressText.textContent = '完成';
                    progressFill.style.width = '100%';
                    generateBtn.disabled = false;
                    
                    setTimeout(() => {
                        progressSection.classList.remove('active');
                        audioSection.classList.add('active');
                        audioPlayer.src = '/api/audio?' + Date.now();
                        audioPlayer.load();
                    }, 500);
                    
                    return;
                } else if (data.status === 'error') {
                    progressText.textContent = '生成失败';
                    generateBtn.disabled = false;
                    return;
                }
                
                if (data.is_generating || data.status === 'loading') {
                    setTimeout(pollProgress, 500);
                } else {
                    generateBtn.disabled = false;
                }
                
            } catch (e) {
                console.error(e);
                setTimeout(pollProgress, 1000);
            }
        }
        
        function updateStatus(status, modelLoaded) {
            statusDot.className = 'status-indicator';
            
            if (status === 'loading') {
                statusDot.classList.add('loading');
                statusText.textContent = '加载中';
            } else if (status === 'generating') {
                statusDot.classList.add('loading');
                statusText.textContent = '生成中';
            } else if (status === 'complete' || (status === 'ready' && modelLoaded)) {
                statusDot.classList.add('ready');
                statusText.textContent = '就绪';
            } else if (status === 'error') {
                statusDot.classList.add('error');
                statusText.textContent = '错误';
            } else {
                statusText.textContent = '未加载';
            }
        }
        
        // Initial parse
        parseScript();
    </script>
</body>
</html>
