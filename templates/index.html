<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Podcast - AI 播客生成器</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-0: #09090b;
            --bg-1: #0c0c0e;
            --bg-2: #111113;
            --bg-3: #18181b;
            --bg-4: #1f1f23;
            --bg-5: #27272a;
            
            --border-1: #1c1c1f;
            --border-2: #27272a;
            
            --text-ui: #a1a1aa;
            --text-ui-muted: #71717a;
            --text-content: #52525b;
            --text-value: #d4d4d8;
            --text-heading: #e4e4e7;
            
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --accent-dim: rgba(139, 92, 246, 0.12);
            
            --host: #ec4899;
            --guest: #3b82f6;
            
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        
        html { font-size: 14px; }
        
        body {
            font-family: var(--font-sans);
            background: var(--bg-0);
            color: var(--text-ui);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Header */
        .header {
            height: 52px;
            background: var(--bg-1);
            border-bottom: 1px solid var(--border-1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
        }
        
        .logo svg {
            height: 28px;
            width: auto;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-ui-muted);
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-ui-muted);
        }
        
        .status-dot.ready { background: #22c55e; }
        .status-dot.loading { background: #f59e0b; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* Main */
        .main {
            display: grid;
            grid-template-columns: 1.618fr 1fr;
            min-height: calc(100vh - 52px);
        }
        
        .panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .panel-left {
            background: var(--bg-0);
            border-right: 1px solid var(--border-1);
        }
        
        .panel-right {
            background: var(--bg-1);
        }
        
        .panel-right .role-section:last-of-type {
            flex: 1;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-ui-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        
        .section-title svg {
            width: 12px;
            height: 12px;
            opacity: 0.6;
        }
        
        /* Upload */
        .upload-zone {
            border: 1px dashed var(--border-2);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 12px;
            background: var(--bg-2);
        }
        
        .upload-zone:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }
        
        .upload-zone svg {
            width: 20px;
            height: 20px;
            color: var(--text-ui-muted);
            margin-bottom: 8px;
        }
        
        .upload-text {
            font-size: 12px;
            color: var(--text-ui-muted);
        }
        
        .upload-hint {
            font-size: 11px;
            color: var(--text-content);
            margin-top: 4px;
        }
        
        /* Editor */
        .editor {
            width: 100%;
            min-height: 360px;
            background: var(--bg-2);
            border: 1px solid var(--border-1);
            border-radius: 8px;
            padding: 14px;
            color: var(--text-content);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.8;
            resize: none;
            outline: none;
        }
        
        .editor:focus {
            border-color: var(--border-2);
        }
        
        .editor::placeholder {
            color: var(--text-content);
            opacity: 0.6;
        }
        
        /* Stats */
        .stats {
            display: flex;
            gap: 16px;
            padding: 12px 0;
            margin-top: 12px;
            border-top: 1px solid var(--border-1);
        }
        
        .stat {
            font-size: 11px;
        }
        
        .stat-label {
            color: var(--text-content);
        }
        
        .stat-value {
            color: var(--text-ui);
            font-family: var(--font-mono);
            margin-left: 4px;
        }
        
        /* Role Section */
        .role-section {
            background: var(--bg-2);
            border: 1px solid var(--border-1);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        
        .role-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-1);
        }
        
        .role-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .role-indicator {
            width: 3px;
            height: 16px;
            border-radius: 2px;
        }
        
        .role-indicator.host { background: var(--host); }
        .role-indicator.guest { background: var(--guest); }
        
        .role-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-heading);
        }
        
        .role-id {
            font-size: 11px;
            color: var(--text-content);
        }
        
        /* Slider Group - 格式塔设计 */
        .slider-group {
            display: grid;
            gap: 12px;
        }
        
        .slider-item {
            display: grid;
            grid-template-columns: 60px 1fr 40px;
            align-items: center;
            gap: 10px;
        }
        
        .slider-label {
            font-size: 11px;
            color: var(--text-ui-muted);
        }
        
        .slider-track {
            position: relative;
            height: 24px;
            display: flex;
            align-items: center;
        }
        
        .slider-track input {
            width: 100%;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--bg-4);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        
        .slider-track input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .slider-track input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .slider-value {
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-value);
            text-align: right;
            background: var(--bg-3);
            padding: 3px 6px;
            border-radius: 4px;
        }
        
        /* Divider */
        .divider {
            height: 1px;
            background: var(--border-1);
            margin: 16px 0;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            outline: none;
        }
        
        .btn svg { width: 12px; height: 12px; }
        
        .btn-ghost {
            padding: 6px 10px;
            background: transparent;
            color: var(--text-ui-muted);
            border: 1px solid var(--border-2);
        }
        
        .btn-ghost:hover {
            background: var(--bg-3);
            color: var(--text-ui);
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            color: white;
            font-weight: 600;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(139, 92, 246, 0.25);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Progress */
        .progress-section {
            margin-top: 12px;
            display: none;
        }
        
        .progress-section.active { display: block; }
        
        .progress-bar {
            height: 2px;
            background: var(--bg-4);
            border-radius: 1px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }
        
        .progress-text {
            font-size: 11px;
            color: var(--text-ui-muted);
            text-align: center;
            margin-top: 8px;
        }
        
        /* Audio */
        .audio-section {
            margin-top: 12px;
            display: none;
        }
        
        .audio-section.active { display: block; }
        
        .audio-card {
            background: var(--bg-2);
            border: 1px solid var(--border-1);
            border-radius: 8px;
            padding: 12px;
        }
        
        .audio-card audio {
            width: 100%;
            height: 32px;
        }
        
        .audio-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        
        .audio-duration {
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-ui-muted);
        }
        
        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            font-size: 11px;
            color: var(--text-ui-muted);
            background: var(--bg-3);
            border: 1px solid var(--border-2);
            border-radius: 5px;
            text-decoration: none;
            transition: all 0.15s;
        }
        
        .btn-download:hover {
            background: var(--bg-4);
            color: var(--text-ui);
        }
        
        .btn-download svg { width: 11px; height: 11px; }
        
        #file-input { display: none; }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        @media (max-width: 900px) {
            .main { grid-template-columns: 1fr; }
            .panel-left { border-right: none; border-bottom: 1px solid var(--border-1); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg width="140" height="32" viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#A78BFA" />
                        <stop offset="100%" stop-color="#60A5FA" />
                    </linearGradient>
                </defs>
                <rect x="0" y="12" width="4" height="16" rx="2" fill="url(#logoGradient)" opacity="0.8">
                    <animate attributeName="height" values="16;24;16" dur="2s" repeatCount="indefinite" />
                    <animate attributeName="y" values="12;8;12" dur="2s" repeatCount="indefinite" />
                </rect>
                <rect x="8" y="8" width="4" height="24" rx="2" fill="url(#logoGradient)">
                    <animate attributeName="height" values="24;32;24" dur="2s" begin="0.3s" repeatCount="indefinite" />
                    <animate attributeName="y" values="8;4;8" dur="2s" begin="0.3s" repeatCount="indefinite" />
                </rect>
                <rect x="16" y="16" width="4" height="8" rx="2" fill="url(#logoGradient)" opacity="0.8">
                    <animate attributeName="height" values="8;16;8" dur="2s" begin="0.6s" repeatCount="indefinite" />
                    <animate attributeName="y" values="16;12;16" dur="2s" begin="0.6s" repeatCount="indefinite" />
                </rect>
                <text x="32" y="28" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="url(#logoGradient)">Deep</text>
                <text x="84" y="28" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#E5E7EB">Podcast</text>
            </svg>
        </div>
        <div class="header-actions">
            <div class="status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">未加载</span>
            </div>
        </div>
    </header>
    
    <main class="main">
        <div class="panel panel-left">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <span class="section-title" style="margin-bottom: 0;">
                    <i data-lucide="file-text"></i>
                    脚本
                </span>
                <button class="btn btn-ghost" id="load-sample">
                    <i data-lucide="file-plus"></i>
                    示例
                </button>
            </div>
            
            <div class="upload-zone" id="upload-zone">
                <i data-lucide="upload-cloud"></i>
                <div class="upload-text">拖放或点击上传</div>
                <div class="upload-hint">TXT / DOCX / JSON / MD</div>
            </div>
            <input type="file" id="file-input" accept=".txt,.docx,.json,.md">
            
            <textarea class="editor" id="script-input" placeholder="发言人1 大家好，欢迎收听本期节目！

发言人2 今天我们来聊一个很有意思的话题..."></textarea>
            
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">对话</span>
                    <span class="stat-value" id="stat-dialogues">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">角色</span>
                    <span class="stat-value" id="stat-speakers">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">字数</span>
                    <span class="stat-value" id="stat-chars">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">时长</span>
                    <span class="stat-value" id="stat-duration">0:00</span>
                </div>
            </div>
        </div>
        
        <div class="panel panel-right">
            <span class="section-title">
                <i data-lucide="sliders-horizontal"></i>
                配置
            </span>
            
            <!-- Host -->
            <div class="role-section">
                <div class="role-header">
                    <div class="role-name">
                        <div class="role-indicator host"></div>
                        <span class="role-label">主持人</span>
                    </div>
                    <span class="role-id">发言人 1</span>
                </div>
                
                <div class="slider-group">
                    <div class="slider-item">
                        <span class="slider-label">声纹</span>
                        <div class="slider-track">
                            <input type="range" id="host-seed" min="1" max="9999" value="3333">
                        </div>
                        <span class="slider-value" id="host-seed-value">3333</span>
                    </div>
                    <div class="slider-item">
                        <span class="slider-label">语速</span>
                        <div class="slider-track">
                            <input type="range" id="host-speed" min="1" max="9" value="5">
                        </div>
                        <span class="slider-value" id="host-speed-value">5</span>
                    </div>
                    <div class="slider-item">
                        <span class="slider-label">情感</span>
                        <div class="slider-track">
                            <input type="range" id="host-emotion" min="0" max="9" value="3">
                        </div>
                        <span class="slider-value" id="host-emotion-value">3</span>
                    </div>
                </div>
            </div>
            
            <!-- Guest -->
            <div class="role-section">
                <div class="role-header">
                    <div class="role-name">
                        <div class="role-indicator guest"></div>
                        <span class="role-label">嘉宾</span>
                    </div>
                    <span class="role-id">发言人 2</span>
                </div>
                
                <div class="slider-group">
                    <div class="slider-item">
                        <span class="slider-label">声纹</span>
                        <div class="slider-track">
                            <input type="range" id="guest-seed" min="1" max="9999" value="5674">
                        </div>
                        <span class="slider-value" id="guest-seed-value">5674</span>
                    </div>
                    <div class="slider-item">
                        <span class="slider-label">语速</span>
                        <div class="slider-track">
                            <input type="range" id="guest-speed" min="1" max="9" value="5">
                        </div>
                        <span class="slider-value" id="guest-speed-value">5</span>
                    </div>
                    <div class="slider-item">
                        <span class="slider-label">情感</span>
                        <div class="slider-track">
                            <input type="range" id="guest-emotion" min="0" max="9" value="5">
                        </div>
                        <span class="slider-value" id="guest-emotion-value">5</span>
                    </div>
                </div>
            </div>
            
            <div class="divider"></div>
            
            <button class="btn btn-primary" id="generate-btn">
                <i data-lucide="sparkles"></i>
                开始生成
            </button>
            
            <div class="progress-section" id="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progress-text">准备中...</div>
            </div>
            
            <div class="audio-section" id="audio-section">
                <div class="audio-card">
                    <audio controls id="audio-player"></audio>
                    <div class="audio-footer">
                        <span class="audio-duration" id="audio-duration">--:--</span>
                        <a href="/api/audio" download="podcast.wav" class="btn-download">
                            <i data-lucide="download"></i>
                            下载
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        lucide.createIcons();
        
        const $ = id => document.getElementById(id);
        
        const sliders = ['host-seed', 'host-speed', 'host-emotion', 'guest-seed', 'guest-speed', 'guest-emotion'];
        sliders.forEach(id => {
            $(id).addEventListener('input', e => {
                $(id + '-value').textContent = e.target.value;
            });
        });
        
        let parseTimeout;
        $('script-input').addEventListener('input', () => {
            clearTimeout(parseTimeout);
            parseTimeout = setTimeout(parseScript, 500);
        });
        
        async function parseScript() {
            const text = $('script-input').value;
            if (!text.trim()) {
                updateStats({ dialogues: 0, speakers: 0, chars: 0, duration: 0 });
                return;
            }
            try {
                const res = await fetch('/api/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.success) updateStats(data.stats);
            } catch (e) {}
        }
        
        function updateStats(s) {
            $('stat-dialogues').textContent = s.dialogues;
            $('stat-speakers').textContent = s.speakers;
            $('stat-chars').textContent = s.chars;
            const m = Math.floor(s.duration / 60);
            const sec = s.duration % 60;
            $('stat-duration').textContent = `${m}:${sec.toString().padStart(2, '0')}`;
        }
        
        $('upload-zone').addEventListener('click', () => $('file-input').click());
        $('upload-zone').addEventListener('dragover', e => { e.preventDefault(); e.target.closest('.upload-zone').style.borderColor = 'var(--accent)'; });
        $('upload-zone').addEventListener('dragleave', e => { e.target.closest('.upload-zone').style.borderColor = ''; });
        $('upload-zone').addEventListener('drop', e => {
            e.preventDefault();
            e.target.closest('.upload-zone').style.borderColor = '';
            if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
        });
        $('file-input').addEventListener('change', e => { if (e.target.files[0]) uploadFile(e.target.files[0]); });
        
        async function uploadFile(file) {
            const fd = new FormData();
            fd.append('file', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    $('script-input').value = data.text;
                    parseScript();
                }
            } catch (e) {}
        }
        
        $('load-sample').addEventListener('click', () => {
            $('script-input').value = `发言人1 大家好，欢迎收听本期播客！今天我们要聊一个非常有意思的话题——人工智能正在如何改变我们的生活。

发言人2 没错，这个话题最近真的太火了。你看现在到处都在讨论AI，从ChatGPT到各种AI绘画工具，感觉一夜之间AI就无处不在了。

发言人1 确实如此。我记得几年前，AI还只是科幻电影里的概念，现在却已经渗透到了我们日常生活的方方面面。

发言人2 对对对，我最近就在用AI帮我写代码、整理文档，效率提升了不少。你有没有类似的体验？

发言人1 当然有！我现在写文章都会先让AI帮我列个大纲，然后再自己填充内容。不过说实话，我觉得AI目前还是个很好的助手，但完全取代人类的创造力，我觉得还早。

发言人2 这点我同意。AI擅长的是处理大量信息、找规律，但真正的创新和情感共鸣，还是需要人来把握。

发言人1 好的，那我们今天就先聊到这里。感谢大家的收听，我们下期再见！`;
            parseScript();
        });
        
        $('generate-btn').addEventListener('click', async () => {
            const text = $('script-input').value;
            if (!text.trim()) return alert('请先输入脚本');
            
            $('generate-btn').disabled = true;
            $('progress-section').classList.add('active');
            $('audio-section').classList.remove('active');
            $('progress-fill').style.width = '0%';
            $('progress-text').textContent = '准备中...';
            
            const settings = {
                host_seed: +$('host-seed').value,
                host_speed: +$('host-speed').value,
                host_emotion: +$('host-emotion').value,
                guest_seed: +$('guest-seed').value,
                guest_speed: +$('guest-speed').value,
                guest_emotion: +$('guest-emotion').value,
            };
            
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, settings })
                });
                const data = await res.json();
                if (!data.success) {
                    alert(data.error);
                    $('generate-btn').disabled = false;
                    $('progress-section').classList.remove('active');
                    return;
                }
                pollProgress();
            } catch (e) {
                alert('请求失败');
                $('generate-btn').disabled = false;
                $('progress-section').classList.remove('active');
            }
        });
        
        async function pollProgress() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                updateStatus(data.status, data.model_loaded);
                $('progress-fill').style.width = (data.progress * 100) + '%';
                
                if (data.status === 'loading') {
                    $('progress-text').textContent = '加载模型...';
                } else if (data.status === 'generating') {
                    $('progress-text').textContent = `生成中 ${Math.round(data.progress * 100)}%`;
                } else if (data.status === 'complete') {
                    $('progress-text').textContent = '完成';
                    $('progress-fill').style.width = '100%';
                    $('generate-btn').disabled = false;
                    setTimeout(() => {
                        $('progress-section').classList.remove('active');
                        $('audio-section').classList.add('active');
                        $('audio-player').src = '/api/audio?' + Date.now();
                        $('audio-player').load();
                    }, 500);
                    return;
                } else if (data.status === 'error') {
                    $('progress-text').textContent = '失败';
                    $('generate-btn').disabled = false;
                    return;
                }
                
                if (data.is_generating || data.status === 'loading') {
                    setTimeout(pollProgress, 500);
                } else {
                    $('generate-btn').disabled = false;
                }
            } catch (e) {
                setTimeout(pollProgress, 1000);
            }
        }
        
        function updateStatus(status, loaded) {
            $('status-dot').className = 'status-dot';
            if (status === 'loading' || status === 'generating') {
                $('status-dot').classList.add('loading');
                $('status-text').textContent = status === 'loading' ? '加载中' : '生成中';
            } else if (status === 'complete' || (status === 'ready' && loaded)) {
                $('status-dot').classList.add('ready');
                $('status-text').textContent = '就绪';
            } else {
                $('status-text').textContent = '未加载';
            }
        }
        
        parseScript();
    </script>
</body>
</html>
